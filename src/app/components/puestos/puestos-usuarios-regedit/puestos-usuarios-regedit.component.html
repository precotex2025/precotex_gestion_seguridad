<div class="dialog-container">
  
  <div class="dialog-header">
    <h2 class="dialog-title">{{ data.Accion === 'I' ? 'Nuevo registro' : 'Editar registro' }}</h2>
    <button type="button" class="btn-close-header" (click)="onCancelar()" title="Cerrar">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <form [formGroup]="formulario" (ngSubmit)="onGuardar()">
    
    <mat-dialog-content class="form-content">
      
      <!-- Fila 1: 4 Columnas (Puesto/Cargo, Proceso, Usuario Asignado, Nivel) -->
      <div class="grid-4-cols">
        <div class="form-section-item">
          <div class="form-label">Puesto / Cargo <span class="required">*</span></div>
          <input type="text" formControlName="ctrol_puesto" class="full-width-input" placeholder="Ej. Supervisor de Calidad">
        </div>
        <div class="form-section-item">
          <div class="form-label">Proceso <span class="required">*</span></div>
          <select formControlName="ctrol_proceso" class="full-width-input">
            <option value="" disabled selected>Seleccione un proceso...</option>
            <optgroup *ngFor="let group of getProcesosKeys()" [label]="group">
              <option *ngFor="let proc of procesosGroups[group]" [value]="proc">{{ proc }}</option>
            </optgroup>
          </select>
        </div>
        <div class="form-section-item">
          <div class="form-label">
            Usuario Asignado (Key User)
            <span style="font-size: 10px; color: #a5b4fc; text-transform: none; font-weight: normal; margin-left: 4px;">(Seleccione o escriba)</span>
          </div>
          <input type="text" 
                 list="keyUsersDataList" 
                 formControlName="ctrol_usuario" 
                 (change)="onSeleccionarKeyUser($event)"
                 (input)="onSeleccionarKeyUser($event)"
                 class="full-width-input" 
                 placeholder="Seleccione Key User creado...">
          <datalist id="keyUsersDataList">
            <option *ngFor="let u of keyUsersList" [value]="u.nombre">
              {{ u.nombre }} — {{ u.puesto }} ({{ u.email }})
            </option>
          </datalist>
        </div>
        <div class="form-section-item">
          <div class="form-label">Nivel <span class="required">*</span></div>
          <select formControlName="ctrol_nivel" class="full-width-input">
            <option value="Gerencial">Gerencial</option>
            <option value="Jefatura">Jefatura</option>
            <option value="Operativo">Operativo</option>
          </select>
        </div>
      </div>

      <!-- Fila 2: 4 Columnas (Permisos, Estado, Correo Electrónico, Contraseña de Acceso) -->
      <div class="grid-4-cols">
        <div class="form-section-item">
          <div class="form-label">Permisos <span class="required">*</span></div>
          <select formControlName="ctrol_permisos" class="full-width-input">
            <option value="Lectura">Lectura</option>
            <option value="Lectura + descarga">Lectura + descarga</option>
            <option value="Lectura + descarga + modificar">Lectura + descarga + modificar</option>
          </select>
        </div>
        <div class="form-section-item">
          <div class="form-label">Estado <span class="required">*</span></div>
          <select formControlName="ctrol_estado" class="full-width-input">
            <option value="Pendiente de activación">Pendiente de activación</option>
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
            <option value="Suspendido">Suspendido</option>
          </select>
        </div>
        <div class="form-section-item">
          <div class="form-label">Correo Electrónico (Email) <span class="required">*</span></div>
          <input type="email" formControlName="ctrol_email" class="full-width-input" placeholder="usuario@precotexperu.com">
        </div>
        <div class="form-section-item">
          <div class="form-label">Contraseña de Acceso <span class="required">*</span></div>
          <input type="text" formControlName="ctrol_password" class="full-width-input" placeholder="Ej: Precotex2026!">
        </div>
      </div>

      <!-- Fila 3: Opción de Envío Automático de Credenciales -->
      <div style="margin-top: 12px; padding: 10px 14px; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px;">
        <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #0f172a; cursor: pointer;">
          <input type="checkbox" formControlName="ctrol_enviar_credenciales" style="width: 17px; height: 17px; accent-color: #2563eb;">
          <span>📧 Enviar usuario y contraseña de acceso por correo automáticamente al guardar</span>
        </label>
      </div>

    </mat-dialog-content>

    <mat-dialog-actions class="dialog-actions-row">
      <button type="button" class="BtnCancelarPlan" mat-flat-button (click)="onCancelar()">
        Cancelar
      </button>
      <button type="submit" class="BtnGuardarPlan" mat-flat-button>
        Guardar
      </button>
    </mat-dialog-actions>
    
  </form>
</div>
