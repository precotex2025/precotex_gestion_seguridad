<div class="dialog-wrapper">
  
  <header class="dialog-header">
    <div class="dialog-icon-container">
      <mat-icon>business</mat-icon>
    </div>
    <div class="dialog-header-text">
      <h2 class="header-title">{{ data.Title ? data.Title.replace('::. ', '').replace(' .::', '') : 'Sede Operativa' }}</h2>
      <p class="dialog-subtitle">Gestión de sedes y asignación de procesos operativos Precotex</p>
    </div>
    <span class="flex-spacer"></span>
    <button type="button" class="btn-close-header" (click)="onClose()" title="Cerrar">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <form [formGroup]="formulario" #formDirective="ngForm" class="dialog-form">
    <div class="dialog-content">
      
      <!-- Nombre de la Sede -->
      <div class="row">
        <label class="form-label">Nombre de la Sede <span class="required">*</span></label>
        <div class="input-wrapper">
          <mat-icon class="input-icon">store</mat-icon>
          <input type="text" 
                 formControlName="ctrol_nombre" 
                 placeholder="Ej. Huachipa 1" 
                 class="form-input">
        </div>
      </div>

      <!-- Dirección -->
      <div class="row">
        <label class="form-label">Dirección <span class="required">*</span></label>
        <div class="input-wrapper">
          <mat-icon class="input-icon">place</mat-icon>
          <input type="text" 
                 formControlName="ctrol_direccion" 
                 placeholder="Ej. Av. Los Frutales 123, Huachipa" 
                 class="form-input">
        </div>
      </div>

      <!-- Estado / Ubicación (Distrito) -->
      <div class="row">
        <label class="form-label">Sede / Ubicación <span class="required">*</span></label>
        <div class="input-wrapper">
          <mat-icon class="input-icon">map</mat-icon>
          <select formControlName="ctrol_estado" class="form-input select-input">
            <option value="">Seleccione una ubicación...</option>
            <option value="Huachipa">Huachipa</option>
            <option value="Independencia">Independencia</option>
            <option value="Ate">Ate</option>
            <option value="SJL">SJL</option>
          </select>
        </div>
      </div>

      <!-- Procesos que operan -->
      <div class="row">
        <label class="form-label">PROCESOS QUE OPERAN</label>
        <div class="checkbox-scroll-container">
          <div *ngFor="let groupKey of getProcesosGroupKeys()" class="checkbox-group">
            <h4 class="checkbox-group-title">{{ groupKey }}</h4>
            <div class="checkbox-grid">
              <div *ngFor="let proc of procesosAgrupados[groupKey]" class="checkbox-item">
                <input type="checkbox" 
                       [id]="'proc-' + proc.codigo_Proceso" 
                       [checked]="isProcesoChecked(proc.codigo_Proceso)"
                       (change)="onToggleProceso(proc.codigo_Proceso)">
                <label [for]="'proc-' + proc.codigo_Proceso">{{ proc.proceso }}</label>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- Acciones / Botones (Siempre visibles al pie) -->
    <div class="button-row"> 
      <button type="button" class="btn-primary" (click)="onSave()"> 
        <mat-icon style="font-size: 18px; width: 18px; height: 18px;">save</mat-icon>
        <span>Grabar Sede</span>
      </button>

      <button type="button" class="btn-secondary" mat-dialog-close (click)="onClose()">
        <span>Cerrar</span>
      </button>
    </div>   
  </form>

</div>
